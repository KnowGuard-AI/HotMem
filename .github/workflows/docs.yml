name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra docs
      - name: Export OpenAPI spec
        run: uv run --locked --extra docs hotmem openapi --output docs/openapi.json
      - name: Build site
        run: uv run --locked --extra docs mkdocs build --strict
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify required public documentation routes
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base_url="${PAGES_URL%/}"
          for path in \
            "" \
            "vision-and-canon/" \
            "agent-memory-portability/" \
            "snapshot-v2/" \
            "llms.txt"
          do
            verified=false
            for attempt in {1..12}
            do
              if curl --fail --silent --show-error --location \
                --retry 2 --retry-all-errors \
                "${base_url}/${path}" > /dev/null
              then
                verified=true
                break
              fi
              sleep 5
            done
            if [ "$verified" != true ]
            then
              echo "Failed to verify ${base_url}/${path}" >&2
              exit 1
            fi
          done
      - name: Close documentation delivery issue after verified deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(gh issue view 75 --json state --jq .state)" = "OPEN" ]
          then
            gh issue close 75 --reason completed \
              --comment "Deployed from ${GITHUB_SHA} and verified all required public documentation routes."
          fi
