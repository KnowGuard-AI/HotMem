site_name: HotMem
site_description: Portable, local-first memory for AI agents and digital organizations
site_url: https://docs.knowguardai.com/
repo_url: https://github.com/KnowGuard-AI/HotMem
repo_name: KnowGuard-AI/HotMem
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  logo: assets/brand/hotmem.svg
  favicon: assets/brand/hotmem.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

plugins:
  - search

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Brand Guidelines: brand-guidelines.md
  - Vision & Canon: vision-and-canon.md
  - Agent Memory Portability: agent-memory-portability.md
  - Quickstart: quickstart.md
  - Architecture Overview: architecture.md
  - API Reference: api.md
  - CLI: cli.md
  - Snapshot v2 Format: snapshot-v2.md
