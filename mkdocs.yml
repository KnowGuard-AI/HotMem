site_name: HotMem
site_description: Portable, local-first memory for AI agents and digital organizations
site_url: https://knowguard-ai.github.io/HotMem
repo_url: https://github.com/KnowGuard-AI/HotMem
repo_name: KnowGuard-AI/HotMem
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  logo: assets/brand/hotmem.svg
  favicon: assets/brand/hotmem.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

plugins:
  - search

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Brand Guidelines: brand-guidelines.md
  - Vision & Canon: vision-and-canon.md
  - Agent Memory Portability: agent-memory-portability.md
  - Documentation Service: documentation-service.md
  - Quickstart: quickstart.md
  - API Reference: api.md
  - CLI: cli.md
  - Snapshot & Portability:
      - Snapshot v2 Format: snapshot-v2.md
      - Company-Brain Interchange Strategy: okf/company-brain-interchange.md
  - Architecture:
      - File-Aware Architecture: okf/file-aware-architecture.md
  - OKF Notes:
      - Overview: okf/index.md
      - Format and Maintenance: okf/format-and-maintenance.md
      - File-Aware Architecture: okf/file-aware-architecture.md
      - File-Native Memory Epic: okf/file-native-epic.md
      - File-Native Memory Practices: okf/file-native-memory-practices.md
  - History:
      - Coding Agent Session Trace: yc_coding_session_trace.md
